events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Map for WebSocket upgrade vs HTTP long-polling handshake compatibility
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream backend cluster with session-routing strategy (ip_hash) for sticky WebSocket handshakes
    upstream backend_upstream {
        ip_hash;
        server backend:5000;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    # 1. Plain HTTP (Port 80) — Automatic 301 Redirect to Secure HTTPS
    # Enforces browser secure context (window.isSecureContext) for webcam access across college LAN
    server {
        listen 80;
        server_name _;

        # Healthcheck endpoint allowed over plain HTTP for load balancers / docker daemon
        location /health {
            access_log off;
            return 200 'OK';
        }

        # All other traffic upgraded to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Institutional HTTPS (Port 443) — TLS 1.2 / TLS 1.3 Reverse Proxy
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Institutional SSL Certificates
        ssl_certificate /etc/nginx/ssl/eipc.crt;
        ssl_certificate_key /etc/nginx/ssl/eipc.key;

        # Hardened TLS Protocols and Cipher Suites
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Institutional Security & Browser Secure Context Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Reverse proxy REST API endpoints to Flask
        location /api/ {
            proxy_pass http://backend_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 90;
        }

        # WebSocket support with sticky session-routing and unbuffered low-latency streaming
        location /socket.io/ {
            proxy_pass http://backend_upstream/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # Route all web traffic to Next.js
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
